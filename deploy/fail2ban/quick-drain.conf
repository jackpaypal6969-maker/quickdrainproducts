# fail2ban filter — Quick Drain Products admin sign-in.
# Installed by deploy.sh as /etc/fail2ban/filter.d/quick-drain.conf
#
# Reads the nginx access log (combined format):
#   1.2.3.4 - - [03/Sep/2026:10:00:00 +0000] "POST /admin/login HTTP/1.1" 303 0 "-" "UA"
# Every POST to /admin/login, /admin/2fa or /admin/2fa/email that returns
# 3xx or 4xx counts. A successful step also answers with a 303 redirect, so
# the jail's maxretry is generous (10 in 15 minutes) — a real admin never
# posts ten times in a quarter hour; a credential stuffer does in seconds.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /admin/(?:login|2fa|2fa/email)(?:\?\S*)? HTTP/[^"]*" [34]\d\d\b

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

# Quick Drain Products — nginx site TEMPLATE.
#
# deploy.sh renders it with an explicit variable list so nginx's own $vars survive:
#   envsubst '${APP_DIR} ${PORT} ${PUBLIC_PORT} ${SERVER_NAME}'
# and installs the result as /etc/nginx/sites-available/zz-quick-drain
# (+ symlink in sites-enabled). "zz-" sorts last, and there is deliberately
# no default_server here, so this file can never capture traffic meant for
# another site on the same box.
#
# Phase 1: PUBLIC_PORT is a raw port (8086). Phase 2: set PUBLIC_PORT=80 in
# .env, re-run ./deploy.sh, then `certbot --nginx -d ${SERVER_NAME}` turns this
# block into the 443 shape shown at the bottom of this file.

server {
    listen ${PUBLIC_PORT};
    # listen [::]:${PUBLIC_PORT};   # add only if the box has IPv6; a reload fails otherwise
    server_name ${SERVER_NAME};

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed CSS (app.<hash>.css) and images: safe to cache hard.
    location /static/ {
        alias ${APP_DIR}/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Webhooks: hand the raw body straight through; signature checks need the
    # exact bytes and no buffering delay.
    location = /webhooks/stripe {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /webhooks/resend {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}


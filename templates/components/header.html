{# Quiet header: wordmark, five links, two icons. Condenses on scroll (static/js/app.js toggles .is-condensed). #}
{% from "components/icons.html" import icon %}
<header class="site-header" id="site-header" data-header>
  <div class="container-x h-full flex items-center justify-between gap-4">
    <a href="/" class="wordmark shrink-0 min-h-11 py-2" aria-label="{{ settings.app_name }} home">Quick Drain <small class="hidden sm:inline">Products</small></a>
    <nav class="hidden md:flex items-center gap-0.5" aria-label="Primary">
      <a href="/products/drain-shot" class="nav-link" {% if path.startswith('/products') %}aria-current="page"{% endif %}>Drain Shot</a>
      <a href="/build-your-box" class="nav-link" {% if path.startswith('/build-your-box') %}aria-current="page"{% endif %}>Build your box</a>
      <a href="/blog" class="nav-link" {% if path.startswith('/blog') %}aria-current="page"{% endif %}>Notes</a>
      <a href="/shipping-and-safety" class="nav-link" {% if path == '/shipping-and-safety' %}aria-current="page"{% endif %}>Shipping &amp; safety</a>
      <a href="{{ settings.booking_url }}" class="nav-link !text-accent" rel="noopener">Book service</a>
    </nav>
    <div class="flex items-center gap-0.5">
      <a href="{{ '/account' if customer else '/account/login' }}" class="icon-btn hidden sm:inline-grid" aria-label="{{ 'Your account' if customer else 'Sign in' }}">{{ icon('user', 19) }}</a>
      <button type="button" class="icon-btn relative" data-open-cart aria-controls="cart-drawer" aria-expanded="false" aria-label="Open cart">
        {{ icon('cart', 19) }}
        <span class="cart-badge" data-cart-count data-count="{{ cart_count }}">{{ cart_count }}</span>
      </button>
      <button type="button" class="icon-btn md:hidden" data-open-nav aria-controls="mobile-nav" aria-expanded="false" aria-label="Open menu">{{ icon('menu', 22) }}</button>
    </div>
  </div>
</header>

{% macro stars(rating, size=16) -%}
<span class="stars" role="img" aria-label="{{ rating }} out of 5 stars">
{%- for i in range(1, 6) -%}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" class="{{ 'off' if i > (rating or 0) else '' }}"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/></svg>
{%- endfor -%}
</span>
{%- endmacro %}

{% extends "admin/base.html" %}
{% set bare = True %}
{% block content %}
<h1 class="text-xl">Sign in</h1>
<p class="text-muted text-sm mt-1">Password first, then your authenticator app.</p>
<form method="post" action="/admin/login" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field">
    <label class="label" for="username">Username</label>
    <input id="username" class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </div>
  <div class="field">
    <label class="label" for="password">Password</label>
    <input id="password" class="input" type="password" name="password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn btn-primary btn-block mt-2">Continue</button>
</form>
<p class="help mt-5 text-center">Every attempt is logged with its address. <a href="/" class="link">Back to the store</a></p>
{% endblock %}

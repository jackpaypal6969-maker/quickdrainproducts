{% extends "admin/base.html" %}
{% set bare = True %}
{% block content %}
<p class="eyebrow">Second factor</p>
<h1 class="text-xl mt-2">Authenticator code</h1>
<p class="text-muted text-sm mt-1">Enter the six digits from your app, or one of your backup codes.</p>
<form method="post" action="/admin/2fa" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field">
    <label class="label" for="code">Code</label>
    <input id="code" class="input font-mono tracking-[0.2em] text-lg" name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="20" required autofocus>
    <p class="help">Backup codes look like <span class="kbd">a1b2-c3d4-e5f6</span> and work once.</p>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Verify</button>
</form>
<form method="post" action="/admin/logout" class="mt-5 text-center">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="btn btn-ghost btn-sm">Start over</button>
</form>
{% endblock %}
